<!-- ping.html -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme-default="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111716">
    <title>实时状态监控 | 嘎嘣脆综合管理系统</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <script src="theme.js"></script>
    <script defer src="i18n-player.js"></script>
    <script defer src="i18n.js"></script>
    <link href="vendor/fontawesome/css/fontawesome.min.css" rel="stylesheet">
    <link href="vendor/fontawesome/css/solid.min.css" rel="stylesheet">
    <link href="interaction-effects.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
    <link href="visual-polish.css" rel="stylesheet">
    <link href="status-redesign.css" rel="stylesheet">
    <link href="material.css" rel="stylesheet">
    <script src="interaction-effects.js"></script>
</head>
<body class="status-page">
    <div class="page-entry-loader">
        <div aria-label="状态页加载中" class="ba-loader" role="status">
            <span class="ba-loader-ring"></span>
            <span class="ba-loader-orbit"></span>
            <span class="ba-loader-core"></span>
            <span class="ba-loader-label">STATUS LINK</span>
        </div>
    </div>
    <header class="status-header">
        <a class="status-brand" href="/"><img src="images/logo.png" alt="" width="34" height="34"><span>嘎嘣脆综合管理系统</span></a>
        <div class="status-actions">
            <a class="status-login" href="/login.html">玩家登录</a>
            <button class="theme-button" data-theme-toggle type="button" aria-label="切换深浅主题" title="切换深浅主题"><i aria-hidden="true" class="fas fa-circle-half-stroke"></i></button>
            <button class="language-toggle" data-language-toggle type="button" aria-label="Switch language" title="Switch language">EN</button>
        </div>
    </header>
    <main class="status-main">
        <section class="status-overview" aria-labelledby="statusTitle">
            <div class="page-heading">
                <p>线路状态</p>
                <h1 id="statusTitle">实时状态监控</h1>
            </div>
            <div class="status-summary">
                <div id="globalStatus" class="global-status" role="status" aria-live="polite">
                    <span class="global-status-mark" aria-hidden="true"></span>
                    <span>正在读取线路状态</span>
                </div>
                <div class="status-meta">
                    <span>数据更新 <time id="updatedAt">--</time></span>
                    <button id="refreshStatus" class="status-refresh" type="button" aria-label="刷新线路状态" title="刷新线路状态">
                        <i class="fas fa-rotate" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>
        <section class="status-board" id="statusBoard" aria-label="线路状态列表" aria-live="off"></section>
    </main>

    <footer>
        <p>© 2024-2026 嘎嘣脆 | 监控系统版本 v1.0.3</p>
    </footer>

    <script defer src="status-page.js"></script>
</body>
</html>
