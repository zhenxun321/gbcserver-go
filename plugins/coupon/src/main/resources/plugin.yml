name: CouponPlugin
version: 1.3.1
main: com.gbc.coupon.CouponPlugin
api-version: '1.21'
author: GBC_Team
description: Redeem server coupons from the configured API.
commands:
  coupon:
    description: Redeem a coupon code.
    usage: /coupon <code>
    permission: coupon.use
permissions:
  coupon.use:
    description: Allows players to redeem coupon codes.
    default: true

